<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ループ・ナイト</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #05050b; overflow: hidden;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  /* セーフエリア（ノッチ）の内側でキャンバスを中央に置く */
  body {
    position: fixed; inset: 0; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  canvas { display: block; background: #0a0a16; cursor: crosshair; touch-action: none; }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
'use strict';

// ================= 定数・チューニング =================
const W = 960, H = 540, HUD_H = 44;
const TICK_MS = 1000 / 60;
const LOOP_TICKS = 600;        // 1ループ = 10秒
const REWIND_TICKS = 48;       // 巻き戻し演出 0.8秒
const MAX_GHOSTS = 8;
const PLAYER_SPEED = 4.2;      // px/tick (= 252 px/s)
const PLAYER_R = 10;
const PLAYER_HP = 3;
const INVULN_TICKS = 60;
const FIRE_COOLDOWN = 7;       // tick (約8.6発/秒)
const BULLET_SPEED = 11;       // px/tick
const BULLET_LIFE = 60;
const SPAWN_WARN = 40;         // 出現予告(無害)の長さ
const BASE_SEED = 0x2f6b1d;
const GHOST_KILL_SCORE = 2;    // ゴーストの弾で倒すと+2
const BEST_KEY = 'loopKnightBest';
const FONT = '"Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif';
// 明るい色相のみ（緑・黄・ピンク・ミント・橙・ライム・ローズ・水色）
const GHOST_HUES = [120, 55, 320, 160, 35, 90, 345, 195];
const GHOST_ALPHA = 0.65;

const ENEMY = {
  chaser:   { r: 12, hp: 3, speed: 1.7,  color: '#ff3b8d' },
  charger:  { r: 14, hp: 3, speed: 0.5,  color: '#ff9a2e', dash: 9, aimT: 40, dashT: 22, restT: 30 },
  splitter: { r: 18, hp: 5, speed: 0.9,  color: '#3dff8a' },
  mini:     { r: 8,  hp: 1, speed: 2.1,  color: '#c8ff3d' },
};

// ================= キャンバス =================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let viewScale = 1;

function fit() {
  // body のパディング（= セーフエリア）を除いた領域に 16:9 で最大化
  const b = document.body, cs = getComputedStyle(b);
  const aw = b.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = b.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const s = Math.max(0.1, Math.min(aw / W, ah / H));
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
  canvas.width = Math.round(W * s * dpr);
  canvas.height = Math.round(H * s * dpr);
  viewScale = canvas.width / W;
}
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 100));
fit();

// ================= ユーティリティ =================
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const hueColor = (h, l = 65) => `hsl(${h},100%,${l}%)`;

function loadBest() {
  try { return Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) { return 0; }
}
function saveBest(v) {
  try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) { /* 保存不可でも続行 */ }
}

// ================= 入力 =================
const keys = {};
// block: スタート/再開のクリックでは撃たない（一度離すまで射撃無効）
const mouse = { x: W / 2, y: H / 2, down: false, block: false };
let paused = false;
// タッチ: 左半分=移動スティック、右半分=照準スティック（押している間は自動射撃）
const JOY_PX = 60;             // スティック半径（CSS px）
const touch = { move: null, aim: null, angle: null };
let isTouch = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
const PAUSE_BTN = { x: W - 42, y: 7, w: 32, h: 30 };

function pause() {
  if (state === 'play' || state === 'rewind') paused = true;
  for (const k in keys) keys[k] = false;
  mouse.down = false; mouse.block = false;
  touch.move = touch.aim = null;
}
function togglePause() { if (paused) paused = false; else pause(); }
const isPortrait = () => isTouch && innerHeight > innerWidth;

// 画面座標 → 論理座標(960x540)。レターボックスを考慮
function toLogical(cx, cy) {
  const r = canvas.getBoundingClientRect();
  return { x: (cx - r.left) * W / r.width, y: (cy - r.top) * H / r.height };
}
function inPauseBtn(p) {
  return (state === 'play' || state === 'rewind') &&
    p.x >= PAUSE_BTN.x - 6 && p.x <= PAUSE_BTN.x + PAUSE_BTN.w + 6 && p.y >= 0 && p.y <= PAUSE_BTN.y + PAUSE_BTN.h + 6;
}

addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'KeyR' && state === 'over') startGame();
  if (e.code === 'KeyP' && !e.repeat) togglePause();
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', pause);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
canvas.addEventListener('mousemove', (e) => {
  isTouch = false;
  const p = toLogical(e.clientX, e.clientY);
  mouse.x = p.x; mouse.y = p.y;
});
canvas.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  mouse.down = true;
  if (inPauseBtn(toLogical(e.clientX, e.clientY))) { togglePause(); mouse.block = true; }
  else if (state === 'title') { startGame(); mouse.block = true; }
  else if (paused) { paused = false; mouse.block = true; }
});
addEventListener('mouseup', () => { mouse.down = false; mouse.block = false; });

// ---- タッチ（ツインスティック）----
document.addEventListener('touchstart', (e) => {
  e.preventDefault();
  isTouch = true;
  if (isPortrait()) return;
  if (state === 'title') { startGame(); return; }       // 開始タップでは撃たない
  if (state === 'over') { if (overTicks >= 36) startGame(); return; } // 0.6秒ガード
  for (const t of e.changedTouches) {
    if (inPauseBtn(toLogical(t.clientX, t.clientY))) { togglePause(); continue; }
    if (paused) { paused = false; continue; }            // 再開タップではスティックを作らない
    const s = { id: t.identifier, ox: t.clientX, oy: t.clientY, x: t.clientX, y: t.clientY };
    if (t.clientX < innerWidth / 2) { if (!touch.move) touch.move = s; }
    else if (!touch.aim) touch.aim = s;
  }
}, { passive: false });
document.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    for (const s of [touch.move, touch.aim]) {
      if (s && s.id === t.identifier) { s.x = t.clientX; s.y = t.clientY; }
    }
  }
}, { passive: false });
function touchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (touch.move && touch.move.id === t.identifier) touch.move = null;
    if (touch.aim && touch.aim.id === t.identifier) touch.aim = null;
  }
}
document.addEventListener('touchend', touchEnd, { passive: false });
document.addEventListener('touchcancel', touchEnd, { passive: false });
// 長押しメニュー・ピンチ・ダブルタップ拡大を抑止
for (const ev of ['contextmenu', 'gesturestart', 'gesturechange', 'dblclick', 'selectstart']) {
  document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
}

// スティックの入力ベクトル（長さ0..1）
function stickVec(s) {
  const dx = s.x - s.ox, dy = s.y - s.oy, len = Math.hypot(dx, dy);
  if (len < 8) return { x: 0, y: 0, len: 0 };
  const m = Math.min(1, len / (JOY_PX * 0.7));
  return { x: dx / len * m, y: dy / len * m, len };
}

// ================= スポーン表（決定的） =================
// side: 0=上 1=右 2=下 3=左, u: 辺に沿った位置(0..1)
function edgePoint(side, u) {
  const m = 30, top = HUD_H + m, bottom = H - m;
  u = clamp(u, 0, 1);
  if (side === 0) return { x: m + u * (W - 2 * m), y: top };
  if (side === 1) return { x: W - m, y: top + u * (bottom - top) };
  if (side === 2) return { x: m + u * (W - 2 * m), y: bottom };
  return { x: m, y: top + u * (bottom - top) };
}

// 1つの辺から count 体がまとまって出てくる「群れ」
function burst(table, rng, type, t0, side, count) {
  const center = 0.2 + rng() * 0.6;
  for (let i = 0; i < count; i++) {
    const p = edgePoint(side, center + (i - (count - 1) / 2) * 0.09);
    table.push({ t: t0 + i * 6, type, x: p.x, y: p.y });
  }
}

// ループnの表 = 共通の基本パターン + ループ2..nの追加分。
// 各部分は固定シードで再生成されるので、ループnの表はループn-1の表を必ず含む。
// 敵の速さはループで変えない（変えるとゴーストの射撃がずれる）。難易度は数と構成だけで上げる。
function buildSpawnTable(n) {
  const table = [];
  let rng = mulberry32(BASE_SEED);
  // 基本: 追尾型14体を3つの群れで（左→右→上下）
  burst(table, rng, 'chaser', 20, 3, 4);
  burst(table, rng, 'chaser', 190, 1, 5);
  burst(table, rng, 'chaser', 360, 0, 3);
  burst(table, rng, 'chaser', 372, 2, 2);
  for (let k = 2; k <= n; k++) {
    rng = mulberry32(BASE_SEED ^ Math.imul(k, 0x9E3779B1));
    const side = () => Math.floor(rng() * 4);
    const time = () => Math.floor(30 + rng() * 450);
    // 追尾型の群れ（3k体）
    burst(table, rng, 'chaser', time(), side(), 3 * k);
    // 突進型 k体（ループ2で2体）
    for (let i = 0; i < k; i++) burst(table, rng, 'charger', time(), side(), 1);
    // 分裂型 ループ3から k-2 体
    for (let i = 0; i < k - 2; i++) burst(table, rng, 'splitter', time(), side(), 1);
  }
  return table.sort((a, b) => a.t - b.t);
}

// ================= ゲーム状態 =================
let state = 'title'; // title | play | rewind | over
let loopNo = 1, tick = 0, score = 0, kills = 0, hp = PLAYER_HP;
let invuln = 0, shake = 0, hurtFlash = 0, rewindT = 0, fireCd = 0, lastBonus = 0;
let player = { x: W / 2, y: (H + HUD_H) / 2, a: 0 };
let bullets = [], enemies = [], particles = [], ghosts = [], fx = [];
let ghostKills = 0;
let overTicks = 0;
let rec = null, spawnTable = [], spawnIdx = 0;
let best = loadBest();
let newBest = false;
let frameCount = 0;

function startGame() {
  loopNo = 1; score = 0; kills = 0; hp = PLAYER_HP;
  ghosts = []; particles = []; fx = []; ghostKills = 0; shake = 0; hurtFlash = 0; newBest = false;
  startLoop();
  state = 'play';
}

function startLoop() {
  tick = 0; invuln = 30; fireCd = 0; touch.angle = null;
  player = { x: W / 2, y: (H + HUD_H) / 2, a: 0 };
  bullets = []; enemies = [];
  spawnTable = buildSpawnTable(loopNo);
  spawnIdx = 0;
  rec = {
    x: new Float32Array(LOOP_TICKS), y: new Float32Array(LOOP_TICKS),
    a: new Float32Array(LOOP_TICKS), s: new Uint8Array(LOOP_TICKS),
    hue: GHOST_HUES[(loopNo - 1) % GHOST_HUES.length],
  };
}

// ================= 更新 =================
function update() {
  if (state === 'play') updatePlay();
  else if (state === 'rewind') {
    if (++rewindT >= REWIND_TICKS) {
      ghosts.push(rec);
      if (ghosts.length > MAX_GHOSTS) ghosts.shift();
      loopNo++;
      startLoop();
      state = 'play';
    }
  }
  else if (state === 'over') overTicks++;
  updateParticles();
  shake *= 0.85;
  if (hurtFlash > 0) hurtFlash--;
}

function updatePlay() {
  while (spawnIdx < spawnTable.length && spawnTable[spawnIdx].t <= tick) spawnEnemy(spawnTable[spawnIdx++]);

  // プレイヤー移動（加速なし＝キビキビ）
  let dx = ((keys.KeyD || keys.ArrowRight) ? 1 : 0) - ((keys.KeyA || keys.ArrowLeft) ? 1 : 0);
  let dy = ((keys.KeyS || keys.ArrowDown) ? 1 : 0) - ((keys.KeyW || keys.ArrowUp) ? 1 : 0);
  if (dx && dy) { dx *= Math.SQRT1_2; dy *= Math.SQRT1_2; }
  if (touch.move) { const v = stickVec(touch.move); dx = v.x; dy = v.y; }
  player.x = clamp(player.x + dx * PLAYER_SPEED, PLAYER_R, W - PLAYER_R);
  player.y = clamp(player.y + dy * PLAYER_SPEED, HUD_H + PLAYER_R, H - PLAYER_R);

  let firing;
  if (isTouch) {
    // 照準スティック: 引いた方向に向き、押している間は撃ち続ける
    if (touch.aim) {
      const v = stickVec(touch.aim);
      if (v.len > 0) touch.angle = Math.atan2(v.y, v.x);
    }
    if (touch.angle !== null) player.a = touch.angle;
    firing = !!touch.aim;
  } else {
    player.a = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    firing = mouse.down && !mouse.block;
  }

  let shot = 0;
  if (fireCd > 0) fireCd--;
  if (firing && fireCd === 0) {
    fireBullet(player.x, player.y, player.a, '#8ffcff', -1);
    fireCd = FIRE_COOLDOWN;
    shot = 1;
  }

  // 記録（位置・照準角・射撃フラグ）
  rec.x[tick] = player.x; rec.y[tick] = player.y; rec.a[tick] = player.a; rec.s[tick] = shot;

  // ゴースト再生（射撃のみがシミュレーションに影響する）
  for (const g of ghosts) {
    if (g.s[tick]) fireBullet(g.x[tick], g.y[tick], g.a[tick], hueColor(g.hue, 70), g.hue);
  }

  updateBullets();
  updateEnemies();
  bulletHits();
  playerHits();
  if (state !== 'play') return; // ゲームオーバー

  if (invuln > 0) invuln--;
  tick++;
  if (tick >= LOOP_TICKS) loopClear();
}

function fireBullet(x, y, a, color, ghostHue) {
  const c = Math.cos(a), s = Math.sin(a);
  bullets.push({ x: x + c * 14, y: y + s * 14, vx: c * BULLET_SPEED, vy: s * BULLET_SPEED, life: BULLET_LIFE, color, ghostHue });
}

function updateBullets() {
  for (const b of bullets) {
    b.x += b.vx; b.y += b.vy; b.life--;
    if (b.x < -10 || b.x > W + 10 || b.y < HUD_H - 10 || b.y > H + 10) b.life = 0;
  }
  bullets = bullets.filter((b) => b.life > 0);
}

function spawnEnemy(s) {
  const d = ENEMY[s.type];
  enemies.push({
    type: s.type, x: s.x, y: s.y, vx: 0, vy: 0, r: d.r, hp: d.hp,
    warn: SPAWN_WARN, flash: 0, phase: 'aim', t: d.aimT || 0, ang: 0, dead: false,
  });
}

function updateEnemies() {
  for (const e of enemies) {
    if (e.warn > 0) { e.warn--; continue; }
    const d = ENEMY[e.type];
    const toP = Math.atan2(player.y - e.y, player.x - e.x);
    if (e.type === 'charger') {
      if (e.phase === 'aim') {
        e.ang = toP;
        e.x += Math.cos(toP) * d.speed; e.y += Math.sin(toP) * d.speed;
        if (--e.t <= 0) { e.phase = 'dash'; e.t = d.dashT; }
      } else if (e.phase === 'dash') {
        e.x += Math.cos(e.ang) * d.dash; e.y += Math.sin(e.ang) * d.dash;
        if (frameCount % 2 === 0) puff(e.x, e.y, d.color, 1, 1.5);
        if (--e.t <= 0) { e.phase = 'rest'; e.t = d.restT; }
      } else if (--e.t <= 0) { e.phase = 'aim'; e.t = d.aimT; }
    } else {
      e.x += Math.cos(toP) * d.speed; e.y += Math.sin(toP) * d.speed;
    }
    e.x += e.vx; e.y += e.vy; e.vx *= 0.85; e.vy *= 0.85;
    e.x = clamp(e.x, e.r, W - e.r);
    e.y = clamp(e.y, HUD_H + e.r, H - e.r);
    if (e.flash > 0) e.flash--;
  }
  // 敵同士の押し合い（重なり防止）
  // ponytail: O(n^2)、敵数が数百を超えたら空間グリッドに
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i];
    if (a.warn > 0) continue;
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j];
      if (b.warn > 0) continue;
      const dx = b.x - a.x, dy = b.y - a.y, min = a.r + b.r;
      const d2 = dx * dx + dy * dy;
      if (d2 > 0 && d2 < min * min) {
        const d = Math.sqrt(d2), push = (min - d) / 2;
        const nx = dx / d, ny = dy / d;
        a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
      }
    }
  }
}

function bulletHits() {
  for (const b of bullets) {
    for (const e of enemies) {
      if (e.warn > 0 || e.dead) continue;
      const dx = b.x - e.x, dy = b.y - e.y, rr = e.r + 3;
      if (dx * dx + dy * dy < rr * rr) {
        b.life = 0;
        e.hp--; e.flash = 5;
        e.vx += b.vx * 0.12; e.vy += b.vy * 0.12;
        puff(b.x, b.y, b.color, 3, 2.5);
        if (e.hp <= 0) killEnemy(e, b);
        break;
      }
    }
  }
  bullets = bullets.filter((b) => b.life > 0);
  enemies = enemies.filter((e) => !e.dead);
}

function killEnemy(e, b) {
  e.dead = true;
  kills++;
  if (b.ghostHue >= 0) {
    // ゴーストの撃破: 色付きリング＋浮かぶ文字＋ボーナス
    ghostKills++;
    score += GHOST_KILL_SCORE;
    const c = hueColor(b.ghostHue, 70);
    fx.push({ kind: 'ring', x: e.x, y: e.y, r: e.r, life: 22, max: 22, color: c });
    fx.push({ kind: 'text', x: e.x, y: e.y - e.r - 6, life: 45, max: 45, color: c, text: `+${GHOST_KILL_SCORE} GHOST` });
  } else {
    score++;
  }
  const color = ENEMY[e.type].color;
  puff(e.x, e.y, color, e.type === 'splitter' ? 24 : 14, 4);
  shake = Math.max(shake, e.type === 'splitter' ? 5 : 3);
  if (e.type === 'splitter') {
    for (const s of [-1, 1]) {
      const a = Math.atan2(player.y - e.y, player.x - e.x) + s * Math.PI / 2;
      enemies.push({
        type: 'mini', x: e.x + Math.cos(a) * 10, y: e.y + Math.sin(a) * 10,
        vx: Math.cos(a) * 5, vy: Math.sin(a) * 5, r: ENEMY.mini.r, hp: ENEMY.mini.hp,
        warn: 0, flash: 0, phase: '', t: 0, ang: 0, dead: false,
      });
    }
  }
}

function playerHits() {
  if (invuln > 0) return;
  for (const e of enemies) {
    if (e.warn > 0) continue;
    const dx = e.x - player.x, dy = e.y - player.y, rr = e.r + PLAYER_R - 2;
    if (dx * dx + dy * dy < rr * rr) {
      hp--;
      invuln = INVULN_TICKS;
      shake = 12; hurtFlash = 12;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      e.vx += dx / d * 9; e.vy += dy / d * 9;
      if (e.type === 'charger') { e.phase = 'rest'; e.t = ENEMY.charger.restT; }
      puff(player.x, player.y, '#ffffff', 20, 5);
      if (hp <= 0) gameOver();
      return;
    }
  }
}

function loopClear() {
  lastBonus = loopNo * 10;
  score += lastBonus;
  hp = Math.min(PLAYER_HP, hp + 1);
  for (const e of enemies) puff(e.x, e.y, ENEMY[e.type].color, 8, 3);
  enemies = []; bullets = [];
  state = 'rewind';
  rewindT = 0;
  shake = 6;
}

function gameOver() {
  state = 'over';
  overTicks = 0;
  touch.move = touch.aim = null;
  puff(player.x, player.y, '#8ffcff', 50, 7);
  shake = 16;
  if (score > best) { best = score; newBest = true; saveBest(best); }
}

// ================= パーティクル（見た目のみ・非決定でOK） =================
function puff(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = Math.random() * spd + 0.5;
    const life = 18 + Math.random() * 18;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life, max: life, color, size: 1.5 + Math.random() * 2.5 });
  }
}
function updateParticles() {
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vx *= 0.92; p.vy *= 0.92; p.life--; }
  particles = particles.filter((p) => p.life > 0);
  for (const f of fx) { f.life--; if (f.kind === 'text') f.y -= 0.6; }
  fx = fx.filter((f) => f.life > 0);
}

// ================= 描画 =================
function draw() {
  frameCount++;
  ctx.setTransform(viewScale, 0, 0, viewScale, 0, 0);
  ctx.fillStyle = '#0a0a16';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawGrid();
  if (state === 'title') {
    drawParticles();
    ctx.restore();
    drawTitle();
    if (isPortrait()) drawPortrait();
    return;
  }
  if (isPortrait() && !paused) pause();
  drawWorld();
  ctx.restore();

  drawHUD();
  if (state === 'rewind') drawRewind();
  if (state === 'over') drawOver();
  if (hurtFlash > 0) {
    ctx.fillStyle = `rgba(255,40,80,${hurtFlash / 40})`;
    ctx.fillRect(0, 0, W, H);
  }
  drawSticks();
  if (paused) {
    ctx.fillStyle = 'rgba(5,5,12,0.6)';
    ctx.fillRect(0, 0, W, H);
    text(isTouch ? 'PAUSE — タップで再開' : 'PAUSE — クリックで再開', W / 2, H / 2, 32, '#ffffff');
    if (!isTouch) text('P キーでも切り替え', W / 2, H / 2 + 40, 15, '#9aa', 'center', 'normal');
  }
  if (isPortrait()) drawPortrait();
}

function drawPortrait() {
  ctx.fillStyle = '#05050b';
  ctx.fillRect(0, 0, W, H);
  text('⟳', W / 2, H / 2 - 50, 64, '#8ffcff');
  text('横向きにしてください', W / 2, H / 2 + 30, 40, '#ffffff');
}

function drawSticks() {
  if (!touch.move && !touch.aim) return;
  const r = canvas.getBoundingClientRect(), k = W / r.width; // CSS px → 論理px
  for (const s of [touch.move, touch.aim]) {
    if (!s) continue;
    const o = toLogical(s.ox, s.oy);
    const ox = clamp(o.x, 0, W), oy = clamp(o.y, 0, H);
    const R = JOY_PX * k;
    let dx = (s.x - s.ox) * k, dy = (s.y - s.oy) * k;
    const len = Math.hypot(dx, dy);
    if (len > R) { dx *= R / len; dy *= R / len; }
    const color = s === touch.aim ? '255,59,141' : '143,252,255';
    ctx.fillStyle = `rgba(${color},0.12)`;
    ctx.strokeStyle = `rgba(${color},0.45)`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ox, oy, R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = `rgba(${color},0.45)`;
    ctx.beginPath(); ctx.arc(ox + dx, oy + dy, R * 0.4, 0, Math.PI * 2); ctx.fill();
  }
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(90,100,255,0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 40) { ctx.moveTo(x + 0.5, HUD_H); ctx.lineTo(x + 0.5, H); }
  for (let y = HUD_H; y <= H; y += 40) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
  ctx.stroke();
}

function drawWorld() {
  // 巻き戻し中はプレイヤーもゴーストも描かない（文字と重ならないように）
  const showShips = state !== 'rewind';
  const idx = Math.min(tick, LOOP_TICKS - 1);
  if (showShips) {
    for (const g of ghosts) drawShip(g.x[idx], g.y[idx], g.a[idx], hueColor(g.hue), GHOST_ALPHA, false);
  }

  for (const e of enemies) drawEnemy(e);

  ctx.globalCompositeOperation = 'lighter';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  for (const b of bullets) {
    ctx.strokeStyle = b.color;
    ctx.beginPath();
    ctx.moveTo(b.x - b.vx * 0.8, b.y - b.vy * 0.8);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';

  if (state === 'play') {
    const blink = invuln > 0 && Math.floor(invuln / 4) % 2 === 0;
    drawShip(player.x, player.y, player.a, '#8ffcff', blink ? 0.35 : 1, true);
  }
  drawFx();
  drawParticles();
}

function drawFx() {
  for (const f of fx) {
    const k = f.life / f.max;
    ctx.globalAlpha = k;
    if (f.kind === 'ring') {
      ctx.strokeStyle = f.color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r + (1 - k) * 28, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      text(f.text, f.x, f.y, 13, f.color);
    }
  }
  ctx.globalAlpha = 1;
}

function drawShip(x, y, a, color, alpha, glow) {
  ctx.save();
  ctx.globalAlpha = alpha;
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = 16; }
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x + Math.cos(a) * 6, y + Math.sin(a) * 6);
  ctx.lineTo(x + Math.cos(a) * 20, y + Math.sin(a) * 20);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x, y, PLAYER_R, 0, Math.PI * 2);
  ctx.fill();
  if (!glow) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke(); }
  ctx.restore();
}

function poly(x, y, r, n, rot) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + i * Math.PI * 2 / n;
    ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
}

function drawEnemy(e) {
  const d = ENEMY[e.type];
  ctx.save();
  if (e.warn > 0) {
    // 出現予告: 縮む点線リング
    const k = e.warn / SPAWN_WARN;
    ctx.globalAlpha = 0.35 + 0.35 * Math.sin(frameCount * 0.4);
    ctx.strokeStyle = d.color;
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 5]);
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r + k * 22, frameCount * 0.05, frameCount * 0.05 + Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    return;
  }
  let x = e.x, y = e.y;
  if (e.type === 'charger' && e.phase === 'aim') {
    // 溜め: 照準線（だんだん濃く）＋終盤は震える
    const k = 1 - e.t / d.aimT;
    ctx.strokeStyle = `rgba(255,154,46,${0.1 + k * 0.5})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(e.ang) * 160, y + Math.sin(e.ang) * 160);
    ctx.stroke();
    if (e.t < 15) { x += (Math.random() - 0.5) * 4; y += (Math.random() - 0.5) * 4; }
  }
  const color = e.flash > 0 ? '#ffffff' : d.color;
  ctx.fillStyle = color;
  ctx.strokeStyle = color;
  ctx.shadowColor = d.color;
  ctx.shadowBlur = 10;
  ctx.lineWidth = 2.5;
  if (e.type === 'chaser') {
    poly(x, y, e.r, 3, Math.atan2(player.y - y, player.x - x));
    ctx.fill();
  } else if (e.type === 'charger') {
    poly(x, y, e.r + 2, 4, e.ang);
    ctx.fill();
  } else if (e.type === 'splitter') {
    poly(x, y, e.r, 6, frameCount * 0.02);
    ctx.globalAlpha = 0.35; ctx.fill(); ctx.globalAlpha = 1; ctx.stroke();
    poly(x, y, e.r * 0.45, 6, -frameCount * 0.04);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.arc(x, y, e.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawParticles() {
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.max;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function text(str, x, y, size, color, align = 'center', weight = 'bold') {
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}

function drawHUD() {
  ctx.fillStyle = 'rgba(8,8,20,0.85)';
  ctx.fillRect(0, 0, W, HUD_H);
  ctx.fillStyle = 'rgba(120,130,255,0.3)';
  ctx.fillRect(0, HUD_H - 1, W, 1);

  ctx.save();
  ctx.shadowColor = '#8ffcff'; ctx.shadowBlur = 10;
  text(`LOOP ${loopNo}`, 16, 22, 22, '#8ffcff', 'left');
  ctx.restore();

  // 残り時間バー
  const bx = 140, bw = 380, by = 16, bh = 12;
  const rewinding = state === 'rewind';
  const remain = rewinding ? 0 : 1 - tick / LOOP_TICKS;
  ctx.strokeStyle = 'rgba(143,252,255,0.5)';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx + 0.5, by + 0.5, bw, bh);
  ctx.fillStyle = remain < 0.25 && state === 'play' ? '#ff3b8d' : '#8ffcff';
  ctx.fillRect(bx + 2, by + 2, (bw - 3) * remain, bh - 3);
  if (rewinding) text('◀◀ REWIND', bx + bw / 2, 22, 13, '#c9a6ff');
  else text(`${Math.ceil(remain * 10)}秒`, bx + bw + 10, 22, 14, '#9aa', 'left', 'normal');

  // HP
  for (let i = 0; i < PLAYER_HP; i++) {
    text('♥', 600 + i * 22, 22, 20, i < hp ? '#ff3b8d' : '#333348');
  }
  text(`ゴースト ${ghosts.length}/${MAX_GHOSTS}`, 676, 22, 14, '#c9a6ff', 'left', 'normal');
  text(`スコア ${score}`, PAUSE_BTN.x - 12, 22, 18, '#ffffff', 'right');
  // 一時停止ボタン（クリック/タップ可）
  if (state === 'play' || state === 'rewind') {
    const b = PAUSE_BTN;
    ctx.strokeStyle = 'rgba(143,252,255,0.6)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w, b.h);
    ctx.fillStyle = '#8ffcff';
    if (paused) poly(b.x + b.w / 2 + 1, b.y + b.h / 2, 8, 3, 0), ctx.fill();
    else { ctx.fillRect(b.x + 10, b.y + 8, 4, 14); ctx.fillRect(b.x + 18, b.y + 8, 4, 14); }
  }
}

function drawRewind() {
  const k = rewindT / REWIND_TICKS;
  // 最初の数フレームは色反転
  if (rewindT < 8) {
    ctx.globalCompositeOperation = 'difference';
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }
  // 走査線＋横ズレのノイズ帯
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 2);
  for (let i = 0; i < 4; i++) {
    const y = Math.random() * H, h = 4 + Math.random() * 16;
    ctx.fillStyle = `rgba(143,252,255,${0.08 + Math.random() * 0.1})`;
    ctx.fillRect(0, y, W, h);
  }
  ctx.fillStyle = `rgba(80,40,160,${0.25 * (1 - k)})`;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.shadowColor = '#c9a6ff'; ctx.shadowBlur = 20;
  text(`ループ ${loopNo} クリア`, W / 2, H / 2 - 30, 44, '#ffffff');
  ctx.restore();
  text(`ループボーナス +${lastBonus}　HP回復`, W / 2, H / 2 + 20, 18, '#c9a6ff');
  text('◀◀ 時間が巻き戻る…', W / 2, H / 2 + 52, 16, '#8ffcff', 'center', 'normal');
}

function drawTitle() {
  ctx.save();
  ctx.shadowColor = '#8ffcff'; ctx.shadowBlur = 24;
  text('ループ・ナイト', W / 2, 150, 64, '#8ffcff');
  ctx.restore();
  text('LOOP KNIGHT', W / 2, 205, 18, '#c9a6ff', 'center', 'normal');
  const lines = [
    isTouch ? '左半分をドラッグで移動、右半分をドラッグで照準（押している間は自動射撃）'
            : 'WASD／矢印キーで移動、マウスで照準、クリック（長押し可）で射撃',
    '10秒ごとに時間が巻き戻り、直前の自分が「ゴースト」になって一緒に戦う',
    '敵はループごとに増える。過去の自分と共闘して生き延びろ（HP 3）',
  ];
  lines.forEach((l, i) => text(l, W / 2, 285 + i * 34, 18, '#d8dcff', 'center', 'normal'));
  const pulse = 0.75 + 0.25 * Math.sin(frameCount * 0.08);
  ctx.globalAlpha = pulse;
  text(isTouch ? 'タップでスタート' : 'クリックでスタート', W / 2, 430, 26, '#ffffff');
  ctx.globalAlpha = 1;
  if (best > 0) text(`ベストスコア ${best}`, W / 2, 480, 16, '#9aa', 'center', 'normal');
}

function drawOver() {
  ctx.fillStyle = 'rgba(5,5,12,0.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.shadowColor = '#ff3b8d'; ctx.shadowBlur = 24;
  text('ゲームオーバー', W / 2, 160, 56, '#ff3b8d');
  ctx.restore();
  text(`スコア ${score}`, W / 2, 245, 32, '#ffffff');
  text(`撃破 ${kills}（ゴースト ${ghostKills}）　到達ループ ${loopNo}`, W / 2, 290, 18, '#d8dcff', 'center', 'normal');
  text(`ベスト ${best}${newBest ? '　NEW!' : ''}`, W / 2, 330, 20, newBest ? '#ffe14d' : '#c9a6ff');
  const pulse = 0.75 + 0.25 * Math.sin(frameCount * 0.08);
  ctx.globalAlpha = isTouch && overTicks < 36 ? 0.25 : pulse;
  text(isTouch ? 'タップでリトライ' : 'R キーでリトライ', W / 2, 410, 24, '#ffffff');
  ctx.globalAlpha = 1;
}

// ================= メインループ（固定60Hz） =================
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(250, now - last);
  last = now;
  while (acc >= TICK_MS) { if (!paused) update(); acc -= TICK_MS; }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
